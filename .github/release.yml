changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: Security and compatibility
      labels:
        - security
        - compatibility
    - title: Features
      labels:
        - enhancement
    - title: Fixes
      labels:
        - bug
        - bugfix
    - title: Documentation and maintenance
      labels:
        - documentation
        - maintenance
    - title: Other changes
      labels:
        - "*"
