[Server]

## Enable authenticated Horus world control. This must be turned on deliberately.
Enabled = false

[Security]

## UTF-8 file containing one exact SteamID64 per line. Relative paths use the server root.
AdminAllowlistPath = BepInEx/config/HorusMod/dedicated_admins.txt

[Safety]

## Keep false to limit deletion to entities created by Horus.
AllowMissionUnitDelete = false

## Keep false to limit orders and unit editing to entities created by Horus.
AllowMissionUnitMutation = false

## Lookup-only/modded content is unsafe unless every required machine has matching content.
AllowIncompatibleContent = false

[Audit]

## Retain daily JSONL audit logs for this many days.
RetentionDays = 14

[Diagnostics]

LogVerbosity = Normal

[Gameplay]

ImproveAIBombingAccuracy = true

[RTS]

EnableIncome = true
EnableUnitCap = true
SyncWithFactionBudget = false
AllowGroupPurchases = false
StrictBaseDeployment = false
BaseDeploymentRadius = 3000

[Placement]

ShipSpawnLift = 3
