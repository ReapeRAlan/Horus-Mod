# Development logging profile for BepInEx 5.
# Copy the relevant values into BepInEx/config/BepInEx.cfg while debugging.
# Horus never modifies the live BepInEx configuration.

[Logging.Console]

Enabled = true

[Logging.Disk]

Enabled = true
LogLevel = All

# Useful PowerShell filter after reproducing an issue:
# Select-String "\[Horus:" BepInEx\LogOutput.log
